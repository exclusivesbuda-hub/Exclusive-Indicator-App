name: Exclusive Indicator Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Exclusive_Indicator_Android_App_FINAL.zip"
      - ".github/workflows/exclusive-indicator-android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q Exclusive_Indicator_Android_App_FINAL.zip -d android-project

      - name: Install Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        working-directory: android-project
        run: |
          /tmp/gradle-8.10.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Exclusive-Indicator-Android-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
